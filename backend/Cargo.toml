[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
frontend = { path = "../frontend" }
syn = { version = "2.0", features = ["full", "extra-traits"] }
graph-cycles = "0.3.0"
petgraph = "0.8"
easy-smt = "0.2.2"
quote = "1.0"
# Countermodel extraction (backend/src/model): links the system libz3
# (Homebrew z3 5.1.0); the Z3_SYS_Z3_HEADER env var points the build at it.
z3 = "0.21"
